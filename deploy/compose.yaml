name: eddies-wallet

services:
  proxy:
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - edge
    depends_on:
      backend:
        condition: service_healthy

  backend:
    # Use an immutable registry reference, normally an image digest.
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in the host-only .env}
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8080"
    networks:
      - edge
      - private
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caddy-data:
  caddy-config:
  postgres-data:

networks:
  edge:
  private:
    internal: true

<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
body{margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--cream-200)}
@keyframes ewaPop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes ewaBounceIn{0%{transform:scale(.7) translateY(10px);opacity:0}60%{transform:scale(1.05) translateY(-2px);opacity:1}100%{transform:scale(1) translateY(0)}}
@keyframes ewaWiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes ewaFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.ewa-kid-tap{transition:transform .12s cubic-bezier(.34,1.56,.64,1)}
.ewa-kid-tap:active{transform:scale(.94)}
.ewa-dots{background-image:radial-gradient(currentColor 2.5px,transparent 2.5px);background-size:22px 22px}
.ewa-bead{transition:transform .2s cubic-bezier(.34,1.56,.64,1),background-color .2s ease}
.ewa-bounce-in{animation:ewaBounceIn .55s cubic-bezier(.34,1.56,.64,1) both}
.ewa-wiggle{animation:ewaWiggle 2.2s ease-in-out infinite}
.ewa-float{animation:ewaFloat 3s ease-in-out infinite}
</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="./ios-frame.jsx"></script>
<script type="text/babel" src="./WelcomeScreen.jsx"></script>
<script type="text/babel" src="./WalletScreen.jsx"></script>
<script type="text/babel" src="./Sheets.jsx"></script>

<script type="text/babel">
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

name: Monitor App Store review status

# GET-only review-status poll. It checks out the shared app-review-submit CLI at
# a committed pin and authenticates with Eddie's existing submit App Store
# Connect key. Do not add a dedicated monitor user or credential. The armed
# cycle is the marketing version in APP_REVIEW_MONITOR_VERSION. An empty
# variable is not_armed: the run succeeds, contacts Apple not at all, and does
# not keep the schedule red between cycles.
#
# This workflow does not submit, mutate, release, or touch a live App Review
# submission. Assemble-only mutation is a separate lane in app-review-submit.yml.
#
# The cadence is four-hourly and off the top of the hour: App Review states move
# in hours, not minutes, and a quieter schedule keeps the notification worth
# reading. A manual dispatch polls the same armed version.
on:
  schedule:
    - cron: "41 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: eddies-app-review-monitor
  cancel-in-progress: false

jobs:
  observe:
    name: Poll the armed App Review cycle
    if: github.repository == 'kunchenguid/eddies-wallet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check out the shared review-submission CLI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: kunchenguid/app-review-submit
          # Pin: kunchenguid/app-review-submit#7 (multi-submission classification).
          # Live-proven against Eddie 0.1.17; current ASC is APPROVED after the
          # 2026-08-25 resubmission. Rejection classification is pinned by the
          # recorded 8e9fbd18-shape fixture in app-review-monitor-e2e.yml.
          ref: 216a65513dbde70d04d0efd021792743f094ed77
          path: .app-review-submit
          token: ${{ secrets.APP_REVIEW_SUBMIT_READ_TOKEN }}
          persist-credentials: false

      - name: Poll the armed App Review cycle
        id: poll
        continue-on-error: true
        env:
          APP_REVIEW_CONFIG: ${{ github.workspace }}/tools/app-review/app-review.config.json
          GITHUB_TOKEN: ${{ github.token }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_REVIEW_MONITOR_VERSION: ${{ vars.APP_REVIEW_MONITOR_VERSION }}
        run: |
          set -euo pipefail
          node .app-review-submit/app_review_pipeline.js monitor | tee "${RUNNER_TEMP}/monitor.toon"

      # GitHub-native surfacing: assign the captain, mention once, and fail if an
      # outcome issue stays open past 24h. This path does not depend on any
      # firstmate home being alive. Closing the issue is the captain ack.
      - name: Surface the terminal outcome to the captain
        if: always()
        env:
          APP_REVIEW_CONFIG: ${{ github.workspace }}/tools/app-review/app-review.config.json
          APP_REVIEW_MONITOR_SUCCEEDED: ${{ steps.poll.outcome == 'success' }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tools/app-review/surface_review_outcome.js "${RUNNER_TEMP}/monitor.toon"

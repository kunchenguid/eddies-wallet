name: App Review submission

# Trusted default-branch assembly of one captain-approved Eddie's Wallet App
# Store version. The automation can only assemble what the captain already
# approved: tools/app-review/manifests/<version>.json binds the exact version,
# build, source commit, release behavior, listing copy, screenshot bytes, Cloud
# in-app purchase review assets, and App Review notes by content hash, and every
# job refuses a manifest whose binding hash or reviewed bytes do not match.
#
# The gate is deliberately SSHHIP-shaped and uses NO GitHub Environment:
#   1. the captain merges the content-bound manifest on main,
#   2. the captain dispatches this workflow manually and types the version twice,
#   3. fresh readiness evidence from app-review-demo-preflight.yml must bind the
#      same candidate, and
#   4. the mutation-capable App Store Connect credential exists only inside the
#      assemble job's one mutating step.
#
# Credential lanes, deliberately separated by job:
#   verify   - no App Store Connect credential and no variable token. The verify
#              lane refuses to start if an App Store Connect credential is present.
#   assemble - the only job with mutation-capable App Store Connect credentials.
#              It checks out kunchenguid/app-review-submit@16df9345 and runs that
#              engine's assemble-only API (`args.assembleOnly: true`) in
#              first-release mode (`args.firstRelease: true`, no baseline). It
#              creates or reuses the review submission and attaches the app
#              version plus every non-APPROVED Cloud subscription, then
#              hard-returns before submit(). It never PATCHes submitted:true,
#              never arms the monitor, and never maps the monitor variable token.
#
# The captain's remaining action after a successful assemble is one Submit tap
# in App Store Connect. This workflow has no auto-submit path.
#
# Assembly is not release: the approved manifest may only choose MANUAL or
# AFTER_APPROVAL release behavior.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact marketing version with a captain-approved manifest, for example 0.2.0
        required: true
        type: string
      confirm:
        description: Repeat the exact same version to confirm
        required: true
        type: string
      mode:
        description: verify performs no App Store mutation; assemble stages the review submission and stops before Submit
        required: true
        default: verify
        type: choice
        options:
          - verify
          - assemble
      evidence:
        description: Base64 readiness evidence from a fresh app-review-demo-preflight run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: eddies-app-review-submission
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the manifest binding and readiness evidence
    if: github.repository == 'kunchenguid/eddies-wallet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pin the manifest-approved commit
        env:
          EDDIES_APP_REVIEW_VERSION: ${{ inputs.version }}
        run: .github/scripts/pin_app_review_manifest.sh

      # Pin detaches to the last commit that changed the manifest, which may
      # predate this verify entrypoint. Restore it from the dispatch SHA without
      # moving HEAD, so the approved bytes stay pinned.
      - name: Restore the verify entrypoint from the dispatch SHA
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: git show "${DISPATCH_SHA}:tools/app-review/verify.py" > tools/app-review/verify.py

      - name: Refuse anything the captain did not approve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EDDIES_APP_REVIEW_VERSION: ${{ inputs.version }}
          EDDIES_APP_REVIEW_CONFIRM: ${{ inputs.confirm }}
          EDDIES_APP_REVIEW_EVIDENCE: ${{ inputs.evidence }}
        run: python3 tools/app-review/verify.py

  assemble:
    name: Assemble the captain-approved candidate without submitting
    needs: verify
    if: >-
      github.repository == 'kunchenguid/eddies-wallet' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'assemble'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pin the manifest-approved commit
        env:
          EDDIES_APP_REVIEW_VERSION: ${{ inputs.version }}
        run: .github/scripts/pin_app_review_manifest.sh

      - name: Restore the assemble-only adapter from the dispatch SHA
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: git show "${DISPATCH_SHA}:tools/app-review/assemble_only.js" > tools/app-review/assemble_only.js

      - name: Check out the shared review-submission CLI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: kunchenguid/app-review-submit
          # Pin: kunchenguid/app-review-submit#10 (first-release + REJECTED reuse).
          ref: 16df9345ada8d50f4e1f7637839b8f2616c54ddb
          path: .app-review-submit
          token: ${{ secrets.APP_REVIEW_SUBMIT_READ_TOKEN }}
          persist-credentials: false

      # This is the only step in the repository that holds a mutation-capable
      # App Store Connect credential for App Review assembly. It never maps the
      # monitor variable token and never PATCHes submitted:true.
      - name: Assemble the review submission and stop before Submit
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_REVIEW_CONFIG: ${{ github.workspace }}/tools/app-review/app-review.config.json
          APP_REVIEW_ENGINE_DIR: ${{ github.workspace }}/.app-review-submit
          EDDIES_APP_REVIEW_VERSION: ${{ inputs.version }}
          EDDIES_APP_REVIEW_CONFIRM: ${{ inputs.confirm }}
          EDDIES_APP_REVIEW_EVIDENCE: ${{ inputs.evidence }}
        run: node tools/app-review/assemble_only.js --assemble-only --first-release

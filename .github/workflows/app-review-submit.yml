name: App Review submission

# Trusted default-branch assembly and optional captain-gated submit of one
# captain-approved Eddie's Wallet App Store version. The automation can only
# assemble or submit what the captain already approved:
# tools/app-review/manifests/<version>.json binds the exact version, build,
# source commit, release behavior, listing copy, screenshot bytes, Cloud
# in-app purchase review assets, and App Review notes by content hash, and
# every job refuses a manifest whose binding hash or reviewed bytes do not
# match.
#
# The gate is deliberately SSHHIP-shaped and uses NO GitHub Environment:
#   1. the captain merges the content-bound manifest on main,
#   2. the captain dispatches this workflow manually and types the version twice,
#   3. fresh readiness evidence from app-review-demo-preflight.yml must bind the
#      same candidate for verify, upload, assemble, and submit, and
#   4. the mutation-capable App Store Connect credential exists only inside the
#      create-version, assemble, upload, and submit jobs' one mutating step
#      each. Those jobs are mutually exclusive: only the dispatched mode runs.
#      Create-version and upload never submit.
#
# Credential lanes, deliberately separated by job:
#   verify   - no App Store Connect credential and no variable token. The verify
#              lane refuses to start if an App Store Connect credential is present.
#              It also runs the Eddie-side listing-screenshot preflight. It does
#              not run for mode=create-version, which is evidence-free.
#   create-version - mutation-capable App Store Connect credentials, same as
#              assemble, never the monitor variable token, never evidence.
#              Checks out kunchenguid/app-review-submit@2fc70e51 and runs
#              create_version.js --create-version onto
#              runSubmission({ createVersion: true }). CREATE_VERSION_ENGINE_ARGV
#              is ["node","app_review_pipeline.js","create-version"]. For a
#              missing update it creates the App Store version, en-US
#              localization including What's New, and listing screenshot sets
#              the new version cannot inherit, under listingPolicy observe.
#              `--first-release` is refused: this lane is update-only.
#              It never asks the engine to submit.
#   assemble - mutation-capable App Store Connect credentials. It checks out
#              kunchenguid/app-review-submit@2fc70e51 and runs assemble-only
#              (`args.assembleOnly: true`). `--first-release` is passed only
#              when the pinned captain-approved manifest has firstRelease:true;
#              an update manifest (baselineVersion) omits it. The engine aligns
#              App Info categories from config (EDUCATION + FINANCE), attaches
#              the app version, both Cloud subscription versions, and their
#              subscription group version, then hard-returns before submit.
#              When listing.screenshotWrites is on, assemble runs after
#              create-version (and after mode=upload only if a slot still
#              needs it) so the version attaches once screenshots are live.
#              It never maps the monitor variable token.
#   upload   - the same App Store Connect credentials as assemble, never the
#              monitor variable token. Positioned before assemble so listing
#              screenshots write while the version is editable. If the version
#              is already on an unsubmitted review submission, the engine
#              deletes only that version reviewSubmissionItem (Cloud items
#              survive), then reserve/upload/commit and verify-before-live.
#              Runs tools/app-review/upload_screenshots.js --upload-screenshots
#              onto runSubmission({ uploadScreenshots: true }), with
#              --first-release only when the pinned manifest is first-release.
#              SCREENSHOT_UPLOAD_ENGINE_ARGV is the engine CLI
#              ["node","app_review_pipeline.js","upload-screenshots"].
#              listingPolicy stays observe. Opt-in is
#              listing.screenshotWrites=true on the captain-approved manifest
#              and config. Do not add screenshots to alignmentWrites.
#   submit   - the same App Store Connect credentials plus the existing
#              EDDIES_REVIEW_MONITOR_VARIABLE_TOKEN, mapped onto the engine
#              env APP_REVIEW_MONITOR_VARIABLE_TOKEN. It runs
#              tools/app-review/full_submit.js --submit, which calls
#              runSubmission({ assembleOnly: false }) - the engine's real
#              submit. `--first-release` is passed only when the pinned
#              manifest is first-release. After Apple accepts, the engine writes
#              APP_REVIEW_MONITOR_VERSION. Default mode remains verify.
#
# Assembly is not release: the approved manifest may only choose MANUAL or
# AFTER_APPROVAL release behavior.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact marketing version with a captain-approved manifest, for example 0.2.0
        required: true
        type: string
      confirm:
        description: Repeat the exact same version to confirm
        required: true
        type: string
      mode:
        description: verify performs no App Store mutation; create-version creates a missing update version without evidence; upload writes listing screenshots while the version is editable; assemble attaches the version (and Cloud items) without submitting; submit asks the engine to submit for review
        required: true
        default: verify
        type: choice
        options:
          - verify
          - create-version
          - assemble
          - upload
          - submit
      evidence:
        description: Base64 readiness evidence from a fresh app-review-demo-preflight run. Required for verify, upload, assemble, and submit. Unused for create-version.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: eddies-app-review-submission
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the manifest binding and readiness evidence
    if: >-
      github.repository == 'kunchenguid/eddies-wallet' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode != 'create-version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pin the manifest-approved commit
        env:
          EDDIES_APP_REVIEW_VERSION: ${{ inputs.version }}
        run: .github/scripts/pin_app_review_manifest.sh

      # Pin detaches to the last commit that changed the manifest, which may
      # predate this verify entrypoint. Restore it from the dispatch SHA without
      # moving HEAD, so the approved bytes stay pinned.
      - name: Restore the verify entrypoint from the dispatch SHA
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          git show "${DISPATCH_SHA}:tools/app-review/verify.py" > tools/app-review/verify.py
          git show "${DISPATCH_SHA}:tools/app-review/screenshot_preflight.py" > tools/app-review/screenshot_preflight.py

      - name: Refuse anything the captain did not approve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EDDIES_APP_REVIEW_VERSION: ${{ inputs.version }}
          EDDIES_APP_REVIEW_CONFIRM: ${{ inputs.confirm }}
          EDDIES_APP_REVIEW_EVIDENCE: ${{ inputs.evidence }}
        run: python3 tools/app-review/verify.py

  create-version:
    name: Create the missing App Store update version without submitting
    if: >-
      github.repository == 'kunchenguid/eddies-wallet' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'create-version'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pin the manifest-approved commit
        env:
          EDDIES_APP_REVIEW_VERSION: ${{ inputs.version }}
        run: .github/scripts/pin_app_review_manifest.sh

      - name: Restore the create-version adapter from the dispatch SHA
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          git show "${DISPATCH_SHA}:tools/app-review/assemble_only.js" > tools/app-review/assemble_only.js
          git show "${DISPATCH_SHA}:tools/app-review/create_version.js" > tools/app-review/create_version.js
          git show "${DISPATCH_SHA}:tools/app-review/screenshot_preflight.py" > tools/app-review/screenshot_preflight.py
          git show "${DISPATCH_SHA}:tools/app-review/first_release_args.py" > tools/app-review/first_release_args.py
          git show "${DISPATCH_SHA}:tools/app-review/app-review.config.json" > tools/app-review/app-review.config.json

      - name: Check out the shared review-submission CLI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: kunchenguid/app-review-submit
          # Same shared-engine pin as assemble.
          ref: 2fc70e5108f2315c770c9cb273b6254d48bd61a4
          path: .app-review-submit
          token: ${{ secrets.APP_REVIEW_SUBMIT_READ_TOKEN }}
          persist-credentials: false

      - name: Preflight listing screenshot slots
        env:
          EDDIES_APP_REVIEW_VERSION: ${{ inputs.version }}
        run: python3 tools/app-review/screenshot_preflight.py --version "${EDDIES_APP_REVIEW_VERSION}"

      # Mutation-capable App Store Connect credential for create-version only.
      # It never maps the monitor variable token, never takes reviewer-path
      # evidence, and never asks the engine to submit for review.
      - name: Create the missing App Store version and stop before Submit
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_REVIEW_CONFIG: ${{ github.workspace }}/tools/app-review/app-review.config.json
          APP_REVIEW_ENGINE_DIR: ${{ github.workspace }}/.app-review-submit
          CREATE_VERSION_ENGINE_ARGV: '["node","app_review_pipeline.js","create-version"]'
          EDDIES_APP_REVIEW_VERSION: ${{ inputs.version }}
          EDDIES_APP_REVIEW_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          extra=()
          flag="$(python3 tools/app-review/first_release_args.py)"
          if [ -n "$flag" ]; then
            extra+=("$flag")
          fi
          node tools/app-review/create_version.js --create-version "${extra[@]}"

  assemble:
    name: Assemble the captain-approved candidate without submitting
    needs: verify
    if: >-
      github.repository == 'kunchenguid/eddies-wallet' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'assemble'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pin the manifest-approved commit
        env:
          EDDIES_APP_REVIEW_VERSION: ${{ inputs.version }}
        run: .github/scripts/pin_app_review_manifest.sh

      - name: Restore the assemble-only adapter and config from the dispatch SHA
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          git show "${DISPATCH_SHA}:tools/app-review/assemble_only.js" > tools/app-review/assemble_only.js
          git show "${DISPATCH_SHA}:tools/app-review/first_release_args.py" > tools/app-review/first_release_args.py
          git show "${DISPATCH_SHA}:tools/app-review/app-review.config.json" > tools/app-review/app-review.config.json

      - name: Check out the shared review-submission CLI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: kunchenguid/app-review-submit
          # Pin: kunchenguid/app-review-submit#19 (create missing update
          # versions under observe; includes #18 editable recovery).
          ref: 2fc70e5108f2315c770c9cb273b6254d48bd61a4
          path: .app-review-submit
          token: ${{ secrets.APP_REVIEW_SUBMIT_READ_TOKEN }}
          persist-credentials: false

      # Mutation-capable App Store Connect credential for assembly only. It
      # never maps the monitor variable token and never asks the engine to
      # submit for review.
      - name: Assemble the review submission and stop before Submit
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_REVIEW_CONFIG: ${{ github.workspace }}/tools/app-review/app-review.config.json
          APP_REVIEW_ENGINE_DIR: ${{ github.workspace }}/.app-review-submit
          EDDIES_APP_REVIEW_VERSION: ${{ inputs.version }}
          EDDIES_APP_REVIEW_CONFIRM: ${{ inputs.confirm }}
          EDDIES_APP_REVIEW_EVIDENCE: ${{ inputs.evidence }}
        run: |
          set -euo pipefail
          extra=()
          flag="$(python3 tools/app-review/first_release_args.py)"
          if [ -n "$flag" ]; then
            extra+=("$flag")
          fi
          node tools/app-review/assemble_only.js --assemble-only "${extra[@]}"

  upload:
    name: Upload listing screenshots without submitting
    needs: verify
    if: >-
      github.repository == 'kunchenguid/eddies-wallet' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'upload'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pin the manifest-approved commit
        env:
          EDDIES_APP_REVIEW_VERSION: ${{ inputs.version }}
        run: .github/scripts/pin_app_review_manifest.sh

      - name: Restore the upload adapter and preflight from the dispatch SHA
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          git show "${DISPATCH_SHA}:tools/app-review/assemble_only.js" > tools/app-review/assemble_only.js
          git show "${DISPATCH_SHA}:tools/app-review/upload_screenshots.js" > tools/app-review/upload_screenshots.js
          git show "${DISPATCH_SHA}:tools/app-review/screenshot_preflight.py" > tools/app-review/screenshot_preflight.py
          git show "${DISPATCH_SHA}:tools/app-review/first_release_args.py" > tools/app-review/first_release_args.py
          git show "${DISPATCH_SHA}:tools/app-review/app-review.config.json" > tools/app-review/app-review.config.json

      - name: Check out the shared review-submission CLI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: kunchenguid/app-review-submit
          # Same shared-engine pin as assemble.
          ref: 2fc70e5108f2315c770c9cb273b6254d48bd61a4
          path: .app-review-submit
          token: ${{ secrets.APP_REVIEW_SUBMIT_READ_TOKEN }}
          persist-credentials: false

      - name: Preflight listing screenshot slots
        env:
          EDDIES_APP_REVIEW_VERSION: ${{ inputs.version }}
        run: python3 tools/app-review/screenshot_preflight.py --version "${EDDIES_APP_REVIEW_VERSION}"

      # Mutation-capable App Store Connect credential for screenshot upload
      # only. It never maps the monitor variable token and never asks the
      # engine to submit for review. Engine contract: --upload-screenshots
      # onto runSubmission({ uploadScreenshots: true }). The argv pin is
      # node app_review_pipeline.js upload-screenshots.
      - name: Upload listing screenshots and stop before Submit
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_REVIEW_CONFIG: ${{ github.workspace }}/tools/app-review/app-review.config.json
          APP_REVIEW_ENGINE_DIR: ${{ github.workspace }}/.app-review-submit
          SCREENSHOT_UPLOAD_ENGINE_ARGV: '["node","app_review_pipeline.js","upload-screenshots"]'
          EDDIES_APP_REVIEW_VERSION: ${{ inputs.version }}
          EDDIES_APP_REVIEW_CONFIRM: ${{ inputs.confirm }}
          EDDIES_APP_REVIEW_EVIDENCE: ${{ inputs.evidence }}
        run: |
          set -euo pipefail
          extra=()
          flag="$(python3 tools/app-review/first_release_args.py)"
          if [ -n "$flag" ]; then
            extra+=("$flag")
          fi
          node tools/app-review/upload_screenshots.js --upload-screenshots "${extra[@]}"

  submit:
    name: Submit the captain-approved candidate for App Review
    needs: verify
    if: >-
      github.repository == 'kunchenguid/eddies-wallet' &&
      github.ref == 'refs/heads/main' &&
      inputs.mode == 'submit'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pin the manifest-approved commit
        env:
          EDDIES_APP_REVIEW_VERSION: ${{ inputs.version }}
        run: .github/scripts/pin_app_review_manifest.sh

      - name: Restore the submit adapters and config from the dispatch SHA
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          git show "${DISPATCH_SHA}:tools/app-review/assemble_only.js" > tools/app-review/assemble_only.js
          git show "${DISPATCH_SHA}:tools/app-review/full_submit.js" > tools/app-review/full_submit.js
          git show "${DISPATCH_SHA}:tools/app-review/first_release_args.py" > tools/app-review/first_release_args.py
          git show "${DISPATCH_SHA}:tools/app-review/app-review.config.json" > tools/app-review/app-review.config.json

      - name: Check out the shared review-submission CLI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: kunchenguid/app-review-submit
          # Same shared-engine pin as assemble.
          ref: 2fc70e5108f2315c770c9cb273b6254d48bd61a4
          path: .app-review-submit
          token: ${{ secrets.APP_REVIEW_SUBMIT_READ_TOKEN }}
          persist-credentials: false

      # Mutation-capable App Store Connect credential plus the monitor-variable
      # write token. Map the existing Eddie secret onto the env name the
      # engine expects. This is the only job that asks the engine to submit
      # for review. It does not invoke the shared pipeline submit subcommand
      # (engine-shaped manifests); Eddie maps through full_submit.js onto
      # runSubmission.
      - name: Submit the review submission to Apple
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_REVIEW_MONITOR_VARIABLE_TOKEN: ${{ secrets.EDDIES_REVIEW_MONITOR_VARIABLE_TOKEN }}
          APP_REVIEW_CONFIG: ${{ github.workspace }}/tools/app-review/app-review.config.json
          APP_REVIEW_ENGINE_DIR: ${{ github.workspace }}/.app-review-submit
          EDDIES_APP_REVIEW_VERSION: ${{ inputs.version }}
          EDDIES_APP_REVIEW_CONFIRM: ${{ inputs.confirm }}
          EDDIES_APP_REVIEW_EVIDENCE: ${{ inputs.evidence }}
        run: |
          set -euo pipefail
          extra=()
          flag="$(python3 tools/app-review/first_release_args.py)"
          if [ -n "$flag" ]; then
            extra+=("$flag")
          fi
          node tools/app-review/full_submit.js --submit "${extra[@]}"

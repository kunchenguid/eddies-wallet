name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  dispatch-release-workflows:
    needs:
      - release-please
    if: ${{ needs.release-please.outputs.release-created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Dispatch release workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag-name }}
        run: |
          set -euo pipefail

          if [ -z "$TAG_NAME" ]; then
            echo "release-please did not return a tag name" >&2
            exit 1
          fi

          # release-please uses GITHUB_TOKEN, so direct tag and release events do not recursively start another workflow.
          # Dispatch release workflows explicitly when release-please creates the release.
          gh workflow run release.yml --ref "$TAG_NAME" -f tag_name="$TAG_NAME"
          gh workflow run ci.yml --ref "$TAG_NAME" -f tag_name="$TAG_NAME" || echo gate-dispatch-failed-nonfatal

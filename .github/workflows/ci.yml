name: CI

# Ordinary pull requests validate here without any Apple credential: this
# workflow references no secrets and runs with read-only permissions.
# Private repositories may keep macOS CI release-only to control runner costs;
# this repository is public, so macOS runner minutes are free and pull requests
# get the same build-and-test gate.
on:
  # release-please opens its release PR with GITHUB_TOKEN, which creates a
  # pull_request run that can only sit in action_required. Its output set is
  # exactly these three files, so excluding them means no run is ever created.
  pull_request:
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - version.txt
  push:
    tags:
      - 'eddies-wallet-v*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to test, for example eddies-wallet-v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.tag_name || github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

jobs:
  xcode:
    name: Xcode build and unit tests
    if: >-
      (github.event_name == 'pull_request') ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'eddies-wallet-v')) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/eddies-wallet-v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag_name, 'eddies-wallet-v'))
    runs-on: macos-26
    timeout-minutes: 45

    env:
      PROJECT_PATH: EddysWallet.xcodeproj
      SCHEME: EddysWallet
      CONFIGURATION: Debug
      DERIVED_DATA_PATH: .build/DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag_name || github.event.release.tag_name || '' }}

      - name: Release pipeline regression checks
        run: ./test/release-checks.sh

      # Boot-free: proves the wrapper boundary and lifecycle's reaping/teardown decisions.
      - name: Simulator lifecycle checks
        run: |
          ./test/check-sim-usage.sh
          ./test/sim-lib-test.sh

      - name: Select Xcode 26
        run: |
          XCODE_APP=$(python3 <<'PY'
          from pathlib import Path
          import re

          def version_key(path):
              match = re.search(r"Xcode_(\d+(?:\.\d+)*)", path.name)
              if not match:
                  return ()
              return tuple(int(part) for part in match.group(1).split("."))

          apps = sorted(Path("/Applications").glob("Xcode_26*.app"), key=version_key)
          if not apps:
              raise SystemExit("No Xcode 26 installation found on this runner")
          print(apps[-1])
          PY
          )
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneSimulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"

      # test/sim.sh owns the whole simulator lifecycle: it reaps orphans, creates
      # exactly one run-scoped device, boots it headlessly, and deletes that device
      # and its XCTest clone on every exit path. Never target a simulator directly
      # here - a hand-made device outlives the job it was created for. `--device`
      # is an ordered preference so CI keeps verifying on the same device family the
      # READMEs do; the runtime falls back to the newest the runner provisions.
      - name: Build
        run: |
          ./test/sim.sh --device "iPhone 17 Pro" --device "iPhone 17" -- \
            xcodebuild build \
              -project "$PROJECT_PATH" \
              -scheme "$SCHEME" \
              -configuration "$CONFIGURATION" \
              -destination "platform=iOS Simulator,id={{UDID}}" \
              -derivedDataPath "$DERIVED_DATA_PATH"

      - name: Unit tests
        run: |
          ./test/sim.sh --device "iPhone 17 Pro" --device "iPhone 17" -- \
            xcodebuild test \
              -project "$PROJECT_PATH" \
              -scheme "$SCHEME" \
              -configuration "$CONFIGURATION" \
              -destination "platform=iOS Simulator,id={{UDID}}" \
              -derivedDataPath "$DERIVED_DATA_PATH" \
              -only-testing:EddysWalletTests \
              -resultBundlePath TestResults-unit.xcresult

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-unit
          path: TestResults-unit.xcresult
          retention-days: 14
          if-no-files-found: ignore

      # Debug-only source (for example a WalletStore #if DEBUG scenario seam)
      # can compile fine here yet break release.yml's Release archive, which
      # is the only place CONFIGURATION=Release ever compiled before this
      # step. No signing, credentials, device, or archive is needed to reach
      # that same compilation boundary.
      - name: Build Release configuration (compile-only regression)
        run: |
          xcodebuild build \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

  xcode-ui:
    name: Xcode UI tests (${{ matrix.name }})
    if: >-
      (github.event_name == 'pull_request') ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'eddies-wallet-v')) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/eddies-wallet-v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag_name, 'eddies-wallet-v'))
    runs-on: macos-26
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          # The previous single invocation timed out after 30 minutes. Keep
          # each full class independently bounded beneath sim.sh's command cap.
          - name: behavior
            test_filter: EddysWalletUITests/EddysWalletUITests
            artifact: ui-behavior
            command_timeout_seconds: 1800
          - name: evidence
            test_filter: EddysWalletUITests/EvidenceCaptureUITests
            artifact: ui-evidence
            # This screenshot-heavy class regularly takes more than 20 minutes
            # on hosted runners. Keep a bounded margin below the 45-minute job
            # timeout instead of racing sim.sh's default 30-minute watchdog.
            command_timeout_seconds: 2400

    env:
      PROJECT_PATH: EddysWallet.xcodeproj
      SCHEME: EddysWallet
      CONFIGURATION: Debug
      DERIVED_DATA_PATH: .build/DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag_name || github.event.release.tag_name || '' }}

      - name: Select Xcode 26
        run: |
          XCODE_APP=$(python3 <<'PY'
          from pathlib import Path
          import re

          def version_key(path):
              match = re.search(r"Xcode_(\d+(?:\.\d+)*)", path.name)
              if not match:
                  return ()
              return tuple(int(part) for part in match.group(1).split("."))

          apps = sorted(Path("/Applications").glob("Xcode_26*.app"), key=version_key)
          if not apps:
              raise SystemExit("No Xcode 26 installation found on this runner")
          print(apps[-1])
          PY
          )
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneSimulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"

      # Each matrix job gets its own run-scoped simulator and teardown. The UI
      # classes execute in parallel, while sim.sh still disables Xcode's own
      # unbounded worker fan-out inside each managed simulator.
      - name: UI tests
        env:
          EW_SIM_COMMAND_TIMEOUT_SECS: ${{ matrix.command_timeout_seconds }}
        run: |
          ./test/sim.sh --device "iPhone 17 Pro" --device "iPhone 17" -- \
            xcodebuild test \
              -project "$PROJECT_PATH" \
              -scheme "$SCHEME" \
              -configuration "$CONFIGURATION" \
              -destination "platform=iOS Simulator,id={{UDID}}" \
              -derivedDataPath "$DERIVED_DATA_PATH" \
              -only-testing:${{ matrix.test_filter }} \
              -resultBundlePath TestResults-${{ matrix.artifact }}.xcresult

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.artifact }}
          path: TestResults-${{ matrix.artifact }}.xcresult
          retention-days: 14
          if-no-files-found: ignore

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eddie's Wallet privacy policy draft</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #2b2420;
      --muted: #6f625a;
      --paper: #fffdf8;
      --peach: #fff0e6;
      --peach-line: #e8b99c;
      --brand: #814c33;
      --gold: #f5cc63;
    }
    * { box-sizing: border-box; }
    html { background: #f5efe8; }
    body {
      margin: 0;
      color: var(--ink);
      font: 17px/1.65 ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(900px, calc(100% - 32px));
      margin: 32px auto 64px;
      padding: clamp(28px, 6vw, 72px);
      background: var(--paper);
      border: 1px solid #e7ddd3;
      border-radius: 28px;
      box-shadow: 0 18px 48px rgb(77 55 42 / 10%);
    }
    .evidence-note {
      margin: 0 0 32px;
      padding: 14px 18px;
      border: 1px solid var(--peach-line);
      border-radius: 16px;
      background: var(--peach);
      color: var(--brand);
      font-size: 14px;
      font-weight: 650;
    }
    h1, h2, h3 { line-height: 1.18; letter-spacing: -0.025em; }
    h1 { margin: 0 0 24px; font-size: clamp(34px, 6vw, 54px); }
    h2 { margin: 52px 0 16px; padding-top: 8px; font-size: 28px; }
    h3 { margin: 30px 0 12px; font-size: 21px; color: var(--brand); }
    p { margin: 0 0 18px; }
    ul, ol { margin: 0 0 22px; padding-left: 26px; }
    li { margin: 8px 0; padding-left: 4px; }
    strong { font-weight: 750; }
    code {
      padding: 2px 6px;
      border-radius: 6px;
      background: #f2ebe4;
      font: 0.9em ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    hr { margin: 54px 0 34px; border: 0; border-top: 2px solid #ebdfd2; }
    .draft {
      padding: 18px 20px;
      border-left: 5px solid var(--gold);
      border-radius: 12px;
      background: #fff8dd;
    }
    @media (max-width: 620px) {
      body { font-size: 16px; }
      main { width: 100%; margin: 0; border: 0; border-radius: 0; padding: 24px 20px 48px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="evidence-note">Rendered from the final docs/privacy-policy.md worktree output after focused test-phase review.</p>
    <article id="policy" aria-live="polite">Loading policy...</article>
  </main>
  <script>
    const escapeHTML = value => value
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;');

    const inline = value => escapeHTML(value)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>');

    function renderMarkdown(markdown) {
      const lines = markdown.replace(/\r/g, '').split('\n');
      const html = [];
      let paragraph = [];
      let list = null;

      const flushParagraph = () => {
        if (!paragraph.length) return;
        const content = inline(paragraph.join(' '));
        const draftClass = content.startsWith('<strong>Status: DRAFT') ? ' class="draft"' : '';
        html.push(`<p${draftClass}>${content}</p>`);
        paragraph = [];
      };
      const closeList = () => {
        if (!list) return;
        html.push(`</${list}>`);
        list = null;
      };

      for (const line of lines) {
        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        const bullet = line.match(/^[-*]\s+(.+)$/);
        const numbered = line.match(/^\d+\.\s+(.+)$/);
        if (heading) {
          flushParagraph(); closeList();
          const level = heading[1].length;
          html.push(`<h${level}>${inline(heading[2])}</h${level}>`);
        } else if (line === '---') {
          flushParagraph(); closeList(); html.push('<hr>');
        } else if (bullet || numbered) {
          flushParagraph();
          const kind = bullet ? 'ul' : 'ol';
          if (list !== kind) { closeList(); list = kind; html.push(`<${kind}>`); }
          html.push(`<li>${inline((bullet || numbered)[1])}</li>`);
        } else if (!line.trim()) {
          flushParagraph(); closeList();
        } else {
          paragraph.push(line.trim());
        }
      }
      flushParagraph(); closeList();
      return html.join('\n');
    }

    fetch('../../../../docs/privacy-policy.md')
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.text();
      })
      .then(markdown => { document.querySelector('#policy').innerHTML = renderMarkdown(markdown); })
      .catch(error => { document.querySelector('#policy').textContent = `Could not render policy: ${error.message}`; });
  </script>
</body>
</html>

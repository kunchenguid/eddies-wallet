<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eddie's Wallet privacy policy draft</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.8.1/github-markdown-light.min.css">
  <style>
    body { margin: 0; background: #f6f8fa; color: #1f2328; }
    main { box-sizing: border-box; max-width: 980px; margin: 32px auto; padding: 48px 64px; background: #fff; border: 1px solid #d0d7de; border-radius: 12px; }
    .evidence-note { margin: 0 0 24px; padding: 12px 16px; border: 1px solid #54aeff66; border-radius: 8px; background: #ddf4ff; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    @media (max-width: 700px) { main { margin: 0; padding: 24px; border: 0; border-radius: 0; } }
  </style>
</head>
<body>
  <main>
    <p class="evidence-note">Rendered from <code>docs/privacy-policy.md</code> at target commit <code>cd3cfc0</code> for test-phase review.</p>
    <article id="policy" class="markdown-body" aria-label="Rendered privacy policy draft">Loading draft...</article>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked@16.1.2/marked.min.js"></script>
  <script>
    fetch('../../../../docs/privacy-policy.md')
      .then((response) => {
        if (!response.ok) throw new Error(`Unable to load policy (${response.status})`);
        return response.text();
      })
      .then((markdown) => { document.querySelector('#policy').innerHTML = marked.parse(markdown); })
      .catch((error) => { document.querySelector('#policy').textContent = error.message; });
  </script>
</body>
</html>
